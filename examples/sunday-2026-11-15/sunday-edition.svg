<svg xmlns="http://www.w3.org/2000/svg" width="768" height="1674" viewBox="0 0 768 1674" role="img" aria-labelledby="title desc">
  <title id="title">Trurl Sunday edition, Sunday, 15 November 2026</title>
  <desc id="desc">One pick per category. See the accompanying issue text for the selection and direct links.</desc>
  <rect x="1" y="1" width="766" height="1672" fill="#FFFFFF" stroke="#E6E6E6" stroke-width="2"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <g transform="translate(44 35) scale(0.132)" fill="#090909"><path d="M0 2H205V40H122V271H82V40H0Z"/><path d="M191 83H231V122C249 93 276 75 317 81V121C310 118 302 117 294 117C256 117 231 142 231 184V271H191Z"/><path d="M335 83H375V186C375 225 385 241 413 241C444 241 468 222 468 184V83H507V271H469V248C451 270 432 277 405 277C357 277 335 248 335 195Z"/><path d="M536 83H576V122C594 93 621 75 656 81V121C649 118 642 117 634 117C600 117 576 142 576 184V271H536Z"/><path d="M675 0H716V271H675Z"/></g>
    <text x="724" y="60" font-size="15" fill="#2355C6" font-weight="700" letter-spacing="1.6" text-anchor="end">SUNDAY, 15 NOVEMBER 2026</text>
    <path d="M44 96H724" fill="none" stroke="#E6E6E6" stroke-width="1.5"/>
    <text x="41" y="183" font-size="68" fill="#090909" font-family="Georgia, Times New Roman, serif" letter-spacing="-2">Sunday edition</text>
    <text x="44" y="223" font-size="22" fill="#6B6B6B">One pick per category</text>
    <path d="M44 255H724" fill="none" stroke="#E6E6E6" stroke-width="1.5"/>
    <text x="44" y="294" font-size="15" fill="#2355C6" font-weight="700" letter-spacing="1.6">BOOK</text>
    <text x="211" y="297" font-size="29" fill="#090909" font-family="Georgia, Times New Roman, serif">The Futurological Congress</text>
    <text x="211" y="330" font-size="19" fill="#090909" font-weight="700">Stanisław Lem</text>
    <text x="211" y="355" font-size="16" fill="#2355C6">2017 Penguin Modern Classics edition · ebook available</text>
    <text x="211" y="377" font-size="19" fill="#6B6B6B">A futurists’ conference sends Ijon Tichy into</text>
    <text x="211" y="402" font-size="19" fill="#6B6B6B">a chemically manipulated future where</text>
    <text x="211" y="427" font-size="19" fill="#6B6B6B">appearances are difficult to trust.</text>
    <path d="M44 461H724" fill="none" stroke="#E6E6E6" stroke-width="1.5"/>
    <text x="44" y="500" font-size="15" fill="#2355C6" font-weight="700" letter-spacing="1.6">PODCAST</text>
    <text x="211" y="503" font-size="29" fill="#090909" font-family="Georgia, Times New Roman, serif">Moonshots and Marketing</text>
    <text x="211" y="536" font-size="19" fill="#090909" font-weight="700">Rory Sutherland with Patrick O’Shaughnessy</text>
    <text x="211" y="561" font-size="19" fill="#090909" font-weight="700">· Invest Like the Best</text>
    <text x="211" y="586" font-size="16" fill="#2355C6">2020 · Invest Like the Best, episode 191</text>
    <text x="211" y="608" font-size="19" fill="#6B6B6B">Sutherland discusses inexpensive marketing</text>
    <text x="211" y="633" font-size="19" fill="#6B6B6B">experiments, psychological surprises and the</text>
    <text x="211" y="658" font-size="19" fill="#6B6B6B">value of asking apparently naive questions.</text>
    <path d="M44 692H724" fill="none" stroke="#E6E6E6" stroke-width="1.5"/>
    <text x="44" y="731" font-size="15" fill="#2355C6" font-weight="700" letter-spacing="1.6">FILM</text>
    <text x="211" y="734" font-size="29" fill="#090909" font-family="Georgia, Times New Roman, serif">After Yang</text>
    <text x="211" y="767" font-size="19" fill="#090909" font-weight="700">Kogonada</text>
    <text x="211" y="792" font-size="16" fill="#2355C6">Sky Cinema UK listing · 92 min</text>
    <text x="211" y="814" font-size="19" fill="#6B6B6B">A father discovers the hidden life of his</text>
    <text x="211" y="839" font-size="19" fill="#6B6B6B">daughter’s android companion.</text>
    <path d="M44 873H724" fill="none" stroke="#E6E6E6" stroke-width="1.5"/>
    <text x="44" y="912" font-size="15" fill="#2355C6" font-weight="700" letter-spacing="1.6">YOUTUBE VIDEO</text>
    <text x="211" y="915" font-size="29" fill="#090909" font-family="Georgia, Times New Roman, serif">What was Sichuan Food</text>
    <text x="211" y="948" font-size="29" fill="#090909" font-family="Georgia, Times New Roman, serif">before the chili pepper?</text>
    <text x="211" y="981" font-size="19" fill="#090909" font-weight="700">Chinese Cooking Demystified</text>
    <text x="211" y="1006" font-size="16" fill="#2355C6">2026 · accompanying recipes and historical sources</text>
    <text x="211" y="1028" font-size="19" fill="#6B6B6B">A culinary-history investigation of Sichuan</text>
    <text x="211" y="1053" font-size="19" fill="#6B6B6B">before chilli peppers, with recreations of</text>
    <text x="211" y="1078" font-size="19" fill="#6B6B6B">Ming-era dishes.</text>
    <path d="M44 1112H724" fill="none" stroke="#E6E6E6" stroke-width="1.5"/>
    <text x="44" y="1151" font-size="15" fill="#2355C6" font-weight="700" letter-spacing="1.6">LECTURE</text>
    <text x="211" y="1154" font-size="29" fill="#090909" font-family="Georgia, Times New Roman, serif">8 Bit &amp; &#x27;8 Bitish&#x27;</text>
    <text x="211" y="1187" font-size="29" fill="#090909" font-family="Georgia, Times New Roman, serif">Graphics-Outside the Box</text>
    <text x="211" y="1220" font-size="19" fill="#090909" font-weight="700">Mark Ferrari</text>
    <text x="211" y="1245" font-size="16" fill="#2355C6">GDC 2016 · practitioner lecture</text>
    <text x="211" y="1267" font-size="19" fill="#6B6B6B">Palette cycling and shifting create elaborate</text>
    <text x="211" y="1292" font-size="19" fill="#6B6B6B">animated scenes from limited-colour pixel</text>
    <text x="211" y="1317" font-size="19" fill="#6B6B6B">art without drawing every frame.</text>
    <path d="M44 1351H724" fill="none" stroke="#E6E6E6" stroke-width="1.5"/>
    <text x="44" y="1390" font-size="15" fill="#2355C6" font-weight="700" letter-spacing="1.6">PAPER</text>
    <text x="211" y="1393" font-size="29" fill="#090909" font-family="Georgia, Times New Roman, serif">Parallel trade-offs in human</text>
    <text x="211" y="1426" font-size="29" fill="#090909" font-family="Georgia, Times New Roman, serif">cognition and neural networks</text>
    <text x="211" y="1459" font-size="19" fill="#090909" font-weight="700">Jacob Russin, Ellie Pavlick and Michael J.</text>
    <text x="211" y="1484" font-size="19" fill="#090909" font-weight="700">Frank</text>
    <text x="211" y="1509" font-size="16" fill="#2355C6">2025 · PNAS · Open access</text>
    <text x="211" y="1531" font-size="19" fill="#6B6B6B">Neural-network simulations link rapid</text>
    <text x="211" y="1556" font-size="19" fill="#6B6B6B">contextual inference and slower weight</text>
    <text x="211" y="1581" font-size="19" fill="#6B6B6B">changes to human curriculum effects,</text>
    <text x="211" y="1606" font-size="19" fill="#6B6B6B">generalisation and retention.</text>
    <path d="M44 1640H724" fill="none" stroke="#E6E6E6" stroke-width="1.5"/>
  </g>
